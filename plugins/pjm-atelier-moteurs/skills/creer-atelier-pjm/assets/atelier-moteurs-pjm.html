<title>Atelier Moteurs PJM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: atelier — liste des fiches à gauche, fiche en cours à droite, onglets par étape. */
:root{
  --paper:#f4f6f5; --sheet:#ffffff; --ink:#18212b; --ink-2:#4c5864; --ink-3:#7b8692;
  --line:#d8dee2; --line-2:#e8ecee; --accent:#0a7380; --accent-ink:#ffffff; --accent-soft:#e1f1f2;
  --ok:#2e7d4f; --ok-soft:#e3f2e8; --warn:#9a6200; --warn-soft:#fbefd7; --bad:#b4233c; --bad-soft:#fbe4e8;
  --mag:#a8326e;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11171c; --sheet:#182027; --ink:#e7ecef; --ink-2:#aab5bf; --ink-3:#7e8a95;
  --line:#2c3842; --line-2:#222c34; --accent:#3fb4c1; --accent-ink:#0b1a1d; --accent-soft:#16343a;
  --ok:#6cc58f; --ok-soft:#173326; --warn:#e3a94a; --warn-soft:#3a2c12; --bad:#f07a8f; --bad-soft:#3d1b23; --mag:#e27bb0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11171c; --sheet:#182027; --ink:#e7ecef; --ink-2:#aab5bf; --ink-3:#7e8a95;
  --line:#2c3842; --line-2:#222c34; --accent:#3fb4c1; --accent-ink:#0b1a1d; --accent-soft:#16343a;
  --ok:#6cc58f; --ok-soft:#173326; --warn:#e3a94a; --warn-soft:#3a2c12; --bad:#f07a8f; --bad-soft:#3d1b23; --mag:#e27bb0;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;letter-spacing:.005em;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100%}
@media (max-width:820px){.app{grid-template-columns:1fr}}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--sheet)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand h1{font-size:20px;font-weight:750}
.brand small{display:block;font:500 11px/1.2 var(--f-mono);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.top .meta{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--ink-2);font-size:12.5px}
.save{font:500 12px var(--f-mono);color:var(--ink-3)}
.save[data-s="saving"]{color:var(--warn)} .save[data-s="saved"]{color:var(--ok)} .save[data-s="error"]{color:var(--bad)}
/* side */
.side{border-right:1px solid var(--line);background:var(--sheet);padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:820px){.side{border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}}
.side h2{font-size:13px;font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.list{display:flex;flex-direction:column;gap:4px}
.item{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;text-align:left;width:100%;border:1px solid transparent;
  background:none;padding:9px 10px;border-radius:var(--r);cursor:pointer}
.item:hover{background:var(--line-2)}
.item[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.item .ic{grid-row:1/3;width:30px;height:30px;border-radius:5px;display:grid;place-items:center;background:var(--line-2);color:var(--ink-2)}
.item b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.empty-side{color:var(--ink-3);font-size:13px;padding:8px 2px}
/* main */
.main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);
  padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--line-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn:focus-visible,.item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.ptype:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-body);padding:4px 8px;border-radius:99px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.brouillon{color:var(--ink-2)} .pill.pret{background:var(--accent-soft);color:var(--accent)}
.pill.construction,.pill.maj,.pill.import{background:var(--warn-soft);color:var(--warn)} .pill.cree{background:var(--ok-soft);color:var(--ok)}
/* head of fiche */
.fhead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.fhead .t{flex:1;min-width:0}
.fhead .t input{font:750 28px/1.15 var(--f-display);font-stretch:82%;border:0;background:none;width:100%;padding:2px 0;border-bottom:1px dashed transparent}
.fhead .t input:hover{border-bottom-color:var(--line)}
.fhead .sub{color:var(--ink-2);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font:500 11px var(--f-mono);color:var(--ink-3);margin-right:6px}
.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.card>.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
.card>.bd{padding:4px 14px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .hint,.hint{font-size:12px;color:var(--ink-3)}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:5px;padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=number]{font-family:var(--f-mono)}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.sec-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-title h2{font-size:19px;font-weight:700}
.sec-title p{margin:0;color:var(--ink-2);font-size:13px;flex-basis:100%}
.code{font:500 12px var(--f-mono);padding:3px 7px;border-radius:4px;background:var(--ink);color:var(--paper)}
.ctype{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2)}
.ctype.option{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.ctype.material{color:var(--mag);border-color:color-mix(in srgb,var(--mag) 40%,transparent)}
.ctype.calculation{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.comp-name{font-weight:600;flex:1;min-width:120px}
.comp-q{color:var(--ink-3);font-size:12.5px}
.tools{display:flex;gap:2px;margin-left:auto}
.sub-card{border:1px solid var(--line-2);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--paper) 55%,var(--sheet))}
.sub-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(140px,1.2fr) minmax(130px,1fr) auto;gap:8px;align-items:start}
.row.mat{grid-template-columns:minmax(160px,1.6fr) minmax(130px,1fr) auto}
@media (max-width:700px){.row,.row.mat{grid-template-columns:1fr}}
.row .custom{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 10px;font:500 12.5px var(--f-mono);background:var(--sheet)}
.chip button{border:0;background:none;cursor:pointer;color:var(--ink-3);width:20px;height:20px;border-radius:50%}
.chip button:hover{background:var(--line-2);color:var(--bad)}
.inline-add{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inline-add input{width:90px}
.matpick{max-height:220px;overflow:auto;border:1px solid var(--line-2);border-radius:5px;padding:6px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 12px;background:var(--sheet)}
.matpick label{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;padding:3px 0}
.matpick input{accent-color:var(--accent);margin-top:3px}
.addbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border:1px dashed var(--line);border-radius:8px}
.addbar .lbl{margin-right:4px}
.confirm{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--bad)}
/* new fiche */
.ptypes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ptype{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.ptype:hover{border-color:var(--accent)}
.ptype[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ptype h3{font-size:18px;font-weight:700}
.ptype p{margin:0;color:var(--ink-2);font-size:13px}
.ptype .qs{font:500 11.5px var(--f-mono);color:var(--ink-3)}
/* recap */
.issues{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.issues li{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:8px 10px;border-radius:5px}
.issues li.bad{background:var(--bad-soft);color:var(--bad)} .issues li.warn{background:var(--warn-soft);color:var(--warn)} .issues li.ok{background:var(--ok-soft);color:var(--ok)}
.summary{display:flex;flex-direction:column;gap:10px}
.summary .c{border-left:3px solid var(--line);padding:2px 0 2px 12px}
.summary .c.option{border-color:var(--accent)} .summary .c.material{border-color:var(--mag)} .summary .c.calculation{border-color:var(--warn)}
.summary .c h4{margin:0 0 4px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.summary ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px}
pre.json{margin:0;max-height:420px;overflow:auto;background:var(--ink);color:var(--paper);border-radius:6px;padding:14px;font:12px/1.5 var(--f-mono)}
.empty{padding:48px 20px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-size:24px;color:var(--ink)}
.empty p{max-width:52ch;margin:0}
.banner{padding:10px 14px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.langsw button{border:0;background:var(--sheet);padding:5px 9px;font:500 12px var(--f-mono);letter-spacing:.04em;cursor:pointer;color:var(--ink-2)}
.langsw button+button{border-left:1px solid var(--line)}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.langsw button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rrows{display:flex;flex-direction:column;gap:2px}
.rrow{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2)}
.rrow:first-child{border-top:0}
.rname{flex:1 1 200px;min-width:0;font-weight:500}
.rchoices{flex-basis:100%;padding-left:12px}
.gq-q{font-weight:600}
.gq.done,.fr.done{border-color:color-mix(in srgb,var(--ok) 40%,var(--line-2))}
.understood{background:var(--accent-soft);color:var(--ink);border-radius:5px;padding:8px 10px;font-size:13px}
.understood b{color:var(--accent)}
details.expert{border:1px dashed var(--line);border-radius:8px;padding:10px 14px}
details.expert summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
#admBtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.lang-banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:6px;font-size:13px;z-index:20}
@media (prefers-reduced-motion:no-preference){.card,.ptype,.item{transition:border-color .15s,background .15s}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="6" y="6" width="18" height="18" fill="none" stroke="var(--ink)" stroke-width="1.5"/><path d="M0 6h4M6 0v4M26 6h4M24 0v4M0 24h4M6 26v4M26 24h4M24 26v4" stroke="var(--accent)" stroke-width="1.5"/><circle cx="15" cy="15" r="3.2" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>
      <div><small id="brandSmall">PrintJobManager</small><h1 id="brandName">Atelier Moteurs</h1></div>
    </div>
    <div class="meta">
      <span id="catInfo">Catalogue PJM : chargement…</span>
      <span class="save" id="saveState" data-s="idle"></span>
      <div class="langsw" id="langSw" role="group" aria-label="Langue"><button type="button" data-lang="fr" aria-pressed="false">FR</button><button type="button" data-lang="es" aria-pressed="false">ES</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
    </div>
  </header>
  <aside class="side">
    <button class="btn primary" id="newBtn" type="button">+ Nouvelle fiche moteur</button>
    <button class="btn ghost sm" id="admBtn" type="button" hidden>Questions guidées (admin)</button>
    <h2 id="sheetsTitle">Fiches</h2>
    <div class="list" id="list"><div class="empty-side">Chargement des fiches…</div></div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {

function normalize(b){
  if(!b.delays||!Array.isArray(b.delays.choices)){ const old=b.delays||{}; b.delays=defaultDelays(); if(old.notes) b.delays.notes=old.notes; }
  if(!Array.isArray(b.restrictions)) b.restrictions=[];

  if(!Array.isArray(b.freeRules)) b.freeRules=[];

  return b;
}

let saveTimer=null;
function touch(){ if(!S.draft) return; S.dirty=true; S.draft.updatedAt=new Date().toISOString(); setSave("saving","saving"); clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); renderList(); }
async function flush(){
  if(!S.draft||!S.dirty) return;
  const id=S.sel, body=JSON.parse(JSON.stringify(S.draft));
  if(S.uidSelf) body.updatedBy=S.uidSelf;
  S.dirty=false;
  if(S.local){ S.briefs.set(id,body); setSave("saved","savedLocal"); return; }
  if(S.saving){ S.dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,400); return; }
  S.saving=true; setSave("saving","saving2");
  try{ await S.db.doc("briefs/"+id).set(body); setSave("saved","saved"); }
  catch(e){ S.dirty=true; const ro=e&&e.code==="invalid_argument"; setSave("error", ro?"readOnly":"saveFail"); if(!ro){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,2500);} }
  finally{ S.saving=false; }
}

function readQCard(card,base){

  const b=S.draft, r=b.freeRules[i]; if(!r||!r.text.trim()||!S.sample) return;
  S.busy.add(r.id); r.error=""; rerenderKeep();
  const ctx=b.components.map(cp=>({type:cp.type, name:cp.name, choices:cp.options?cp.options.map(x=>x.name):undefined, papers:cp.materials&&cp.materials.length?cp.materials:undefined}));
  const langName={fr:"French",es:"Spanish",en:"English"}[LANG];
  const prompt="You help a print shop configure a pricing engine in PrintJobManager (PJM). The engine form has these components (questions shown to the buyer):\n"+JSON.stringify(ctx)+
    "\nProduct type: "+b.productType+". Lead-time choices: "+(b.delays.enabled?b.delays.choices.map(x=>x.label).join(", "):"none")+".\nThe printer wrote this business rule:\n\""+r.text+"\"\n"+
    "Rephrase how you understood it in plain "+langName+", in one or two short sentences a non-technical printer can confirm (refer to questions and choices by their names, never mention PJM internals). "+
    "Also list the concrete effects on the form (hide question X when Y = Z, remove choice A from X when ..., limit Q1 to ..., add step ...). If the rule is ambiguous, ask one short clarifying question in "+langName+".\n"+
    'Reply with only JSON: {"understood":"...","effects":["..."],"unclear":""}';
  try{
    const res=await S.sample.json(prompt,{cache:false});
    const cur=S.draft&&S.draft.freeRules.find(x=>x.id===r.id);
    if(cur){ cur.understood=String(res.understood||""); cur.effects=Array.isArray(res.effects)?res.effects.map(String):[]; cur.unclear=String(res.unclear||""); cur.lang=LANG; touch(); }
  }catch(e){ const cur=S.draft&&S.draft.freeRules.find(x=>x.id===r.id); if(cur) cur.error=t("fr_err",{e:(e&&(e.message||e.code))||"error"}); }
  finally{ S.busy.delete(r.id); rerenderKeep(); }
}

async function translateBrief(){
  const b=S.draft; if(!b||!S.sample||S.translating) return;
  const target=LANG, src=b.language;
  const refs=[];
  const push=(obj,key)=>{ if(obj&&typeof obj[key]==="string"&&obj[key].trim()) refs.push([obj,key]); };
  push(b,"description");
  if(/^(Nouveau moteur|Nuevo motor|New engine) – /.test(b.name)) push(b,"name");
  for(const cp of b.components){ push(cp,"name"); push(cp,"userText"); if(cp.type==="quantity") push(cp,"unit"); if(cp.options) for(const op of cp.options){ push(op,"name"); for(const st of op.steps) push(st,"note"); } if(cp.steps) for(const st of cp.steps) push(st,"note"); }
  push(b.delays,"name"); push(b.delays,"userText"); push(b.delays,"notes");
  for(const x of b.delays.choices) push(x,"label");
  for(const r of b.freeRules){ push(r,"text"); push(r,"understood"); }
  push(b,"rulesNotes"); push(b,"notes"); push(b.margin,"notes");
  const strings=refs.map(([o,k])=>o[k]);
  const names={fr:"French",es:"Spanish",en:"English"};
  const prompt="Translate each string of this JSON array from "+names[src]+" to "+names[target]+". It is the configuration of a print-shop pricing engine (questions, choices, units, notes). Keep the same order and count, keep numbers, codes like Q1, NCalc formulas and units like mm/cm/g unchanged, keep lead-time labels short (J+5 becomes D+5 in Spanish or English). Do not translate product, machine or paper brand names. Reply with only a JSON array of strings.\n"+JSON.stringify(strings);
  S.translating=true; rerenderKeep();
  try{
    const out=await S.sample.json(prompt,{cache:false});
    if(!Array.isArray(out)||out.length!==strings.length) throw {message:"bad length"};
    const oldNames=new Map();
    refs.forEach(([o,k],i)=>{ if(k==="name"&&o.options) oldNames.set(o.id,o.options.map(x=>x.name)); });
    // remember old choice names to remap hideWhen values
    const choiceMap=new Map(); b.components.forEach(cp=>{ if(cp.options) cp.options.forEach(op=>choiceMap.set(cp.id+"|"+op.name,op)); });
    const resMap=(b.restrictions||[]).map(r=>{ const tg=b.components.find(x=>x.id===r.thenComp); return r.removeChoices.map(n=>tg&&tg.options?tg.options.find(op=>op.name===n):null); });
    refs.forEach(([o,k],i)=>{ o[k]=String(out[i]); });
    for(const cp of b.components) for(const hw of (cp.hideWhen||[])){ const op=choiceMap.get(hw.component+"|"+hw.value); if(op) hw.value=op.name; }
    (b.restrictions||[]).forEach((r,ri)=>{ const op=choiceMap.get(r.ifComp+"|"+r.ifValue); if(op) r.ifValue=op.name; r.removeChoices=r.removeChoices.map((n,ni)=>{ const o2=resMap[ri][ni]; return o2?o2.name:n; }); });
    b.language=target; touch(); toast(t("fl_done",{l:t("l_"+target).toLowerCase()}));
  }catch(e){ toast(t("fl_err",{e:(e&&(e.message||e.code))||"error"})); }
  finally{ S.translating=false; rerenderKeep(); }
}

function condChoices(cp){ return cp.type==="option"? cp.options.map(x=>x.name) : (cp.materials||[]); }
function corpus(b){
  const parts=[];
  for(const cp of b.components){ parts.push(cp.name,cp.userText); if(cp.options) for(const o2 of cp.options){ parts.push(o2.name); for(const st of o2.steps) parts.push(st.resource,st.process); } if(cp.materials) parts.push(...cp.materials); if(cp.steps) for(const st of cp.steps) parts.push(st.resource,st.process); }
  return parts.join(" \n ").toLowerCase();
}
function qText(qq,field){ const v=(qq[field]||{}); return v[LANG]||v.fr||v.es||v.en||""; }
function questionsFor(b){
  const cor=corpus(b);
  return S.questions.filter(qq=>qq.active!==false && (!qq.productTypes||!qq.productTypes.length||qq.productTypes.includes("*")||qq.productTypes.includes(b.productType)) &&
    (!qq.showIf || qq.showIf.split("|").map(x=>x.trim().toLowerCase()).filter(Boolean).some(x=>cor.includes(x))))
    .sort((a,b2)=>(a.order||0)-(b2.order||0));
}
function allPapers(b){ return [...new Set(b.components.filter(x=>x.type==="material").flatMap(x=>x.materials||[]))]; }
function answered(v){ return v!==undefined&&v!==""&&v!==null&&!(Array.isArray(v)&&!v.length)&&!(typeof v==="object"&&!Array.isArray(v)&&!(v.w||v.h)); }
function guidedHtml(b){
  const qs=questionsFor(b);
  if(!qs.length) return '<p class="hint">'+t("g_none")+'</p>';
  const nA=qs.filter(qq=>answered(b.guided[qq.id])).length;
  return '<p class="hint" style="margin:0">'+t("g_answered",{a:nA,n:qs.length})+'</p>'+qs.map(qq=>{
    const v=b.guided[qq.id]; const id=esc(qq.id); let inp="";
    if(qq.answerType==="yesno") inp='<div style="display:flex;gap:16px">'+[["yes",t("g_yes")],["no",t("g_no")]].map(([k,l])=>'<label class="check"><input type="radio" name="g-'+id+'" data-g="'+id+'" value="'+k+'"'+(v===k?" checked":"")+'>'+l+'</label>').join("")+'</div>';
    else if(qq.answerType==="number") inp='<div class="inline-add"><input type="number" data-g="'+id+'" data-gnum="1" value="'+esc(v??"")+'" style="width:120px"><span class="hint">'+esc(qq.unit||"")+'</span></div>';
    else if(qq.answerType==="size"){ const sv=v||{}; inp='<div class="inline-add"><input type="number" data-g="'+id+'" data-gpart="w" value="'+esc(sv.w??"")+'" aria-label="'+t("width")+'"><span>×</span><input type="number" data-g="'+id+'" data-gpart="h" value="'+esc(sv.h??"")+'" aria-label="'+t("height")+'"><span class="hint">'+esc(qq.unit||"")+'</span></div>'; }
    else if(qq.answerType==="materials"){ const ps=allPapers(b); const sel=Array.isArray(v)?v:[]; inp=ps.length?'<div class="matpick">'+ps.map(p=>'<label><input type="checkbox" data-g="'+id+'" data-gmat="1" value="'+esc(p)+'"'+(sel.includes(p)?" checked":"")+'>'+esc(p)+'</label>').join("")+'</div>':'<span class="hint">'+t("g_noPapers")+'</span>'; }
    else inp='<textarea data-g="'+id+'">'+esc(v??"")+'</textarea>';
    const eff=qText(qq,"effect");
    return '<div class="sub-card gq'+(answered(v)?" done":"")+'"><div class="gq-q">'+esc(qText(qq,"text"))+'</div>'+inp+(eff?'<span class="hint">'+t("g_effect",{e:esc(eff)})+'</span>':'')+'</div>';
  }).join("");
}

function expertHtml(b){
  const conds=b.components.filter(x=>(x.type==="option"&&x.options.length)||(x.type==="material"&&x.mode==="specific"&&x.materials.length));
  if(!conds.length) return '<p class="hint">'+t("r_noOpts")+'</p>';
  const targets=b.components.filter(x=>x.type!=="quantity");
  let h='<p class="hint" style="margin:0">'+t("r_text")+'</p><div class="banner" style="background:var(--accent-soft);color:var(--accent)">'+t("r_auto")+'</div>';
  for(const cp of conds){
    const n=b.components.filter(x=>(x.hideWhen||[]).some(hw=>hw.component===cp.id)).length + b.restrictions.filter(r=>r.ifComp===cp.id).length;
    h+='<div class="card"><div class="hd"><span class="ctype '+cp.type+'">'+t("ct_"+cp.type)+'</span><span class="comp-name">'+esc(cp.name)+'</span><span class="comp-q">'+t("r_count",{n:n})+'</span></div><div class="bd">';
    for(const v of condChoices(cp)){
      let rows='';
      for(const tg of targets){ if(tg.id===cp.id) continue;
        const hidden=(tg.hideWhen||[]).some(hw=>hw.component===cp.id&&hw.value===v);
        const rs=b.restrictions.find(r=>r.ifComp===cp.id&&r.ifValue===v&&r.thenComp===tg.id);
        const key=esc(cp.id)+'|'+esc(v)+'|'+esc(tg.id);
        rows+='<div class="rrow"><span class="rname">'+esc(tg.name)+'</span><label class="check"><input type="checkbox" data-rhide="'+key+'"'+(hidden?" checked":"")+'>'+t("r_hide")+'</label>';
        if(tg.type==="option"&&tg.options.length>1&&!hidden){
          rows+='<label class="check"><input type="checkbox" data-rres="'+key+'"'+(rs?" checked":"")+'>'+t("r_restrict")+'</label>';
          if(rs) rows+='<div class="chips rchoices">'+tg.options.map(op=>'<label class="chip" style="padding-right:10px"><input type="checkbox" data-rch="'+key+'" value="'+esc(op.name)+'"'+(rs.removeChoices.includes(op.name)?" checked":"")+' style="accent-color:var(--accent)">'+esc(op.name)+'</label>').join("")+'</div>';
        }
        rows+='</div>';
      }
      h+='<div class="sub-card"><div class="lbl">'+t("r_q",{v:esc(v),c:esc(cp.name)})+'</div><div class="rrows">'+rows+'</div></div>';
    }
    h+='</div></div>';
  }
  h+='<div class="card"><div class="bd" style="border-top:0;padding-top:16px">'+fld(t("r_other"),"rulesNotes",b.rulesNotes,{type:"textarea",wide:true,ph:t("r_otherPh"),hint:t("r_otherHint")})+'</div></div>';
  return h;
}
function validate(b){
  const out=[];
  const defaultNames=PT_KEYS.flatMap(k=>LANGS.map((l,i)=>T.newEngine[i].replace("{p}",T["pt_"+k][i])));
  if(!b.name||defaultNames.includes(b.name)) out.push(["warn",t("v_name")]);
  const codes=b.components.filter(x=>x.type==="quantity").map(x=>x.code);
  if(!codes.includes("Q1")) out.push(["bad",t("v_q1")]);
  if(new Set(codes).size!==codes.length) out.push(["bad",t("v_dup")]);
  const known=new Set(S.catalog.resources.map(r=>r.name));
  for(const cp of b.components){
    if(cp.type==="option"){
      if(!cp.options.length) out.push(["bad",t("v_noChoice",{c:cp.name})]);
      for(const op of cp.options) for(const s of op.steps){
        if(!s.resource||!s.process) out.push(["bad",t("v_step",{c:cp.name,o:op.name})]);
        if(s.basis==="custom"&&!s.formula&&!s.note) out.push(["warn",t("v_custom",{c:cp.name,o:op.name})]);
      }
    }
    if(cp.type==="material"){
      if(!cp.category) out.push(["bad",t("v_cat",{c:cp.name})]);
      if(cp.mode==="specific"&&!cp.materials.length) out.push(["bad",t("v_noMat",{c:cp.name})]);
      if(cp.imposition==="brochure4"&&!codes.includes("Q2")) out.push(["warn",t("v_q2",{c:cp.name})]);
    }
    if(cp.type==="calculation") for(const s of cp.steps) if(!s.resource||!s.process) out.push(["bad",t("v_calc",{c:cp.name})]);
    const allSteps=cp.type==="option"?cp.options.flatMap(x=>x.steps):(cp.steps||[]);
    for(const s of allSteps) if(s.resource&&known.size&&!known.has(s.resource)) out.push(["warn",t("v_res",{r:s.resource})]);
  }
  if(!PJM_URL&&!S.local) out.push(["warn",t("set_pjmMissing")]);
  if(b.delays.enabled&&!b.delays.choices.length) out.push(["bad",t("dl_none")]);
  { const qs=questionsFor(b); const nA=qs.filter(qq=>answered(b.guided[qq.id])).length; if(nA<qs.length) out.push(["warn",t("g_title")+" : "+t("g_answered",{a:nA,n:qs.length})]); }
  for(const r of b.restrictions){ const tg=b.components.find(x=>x.id===r.thenComp), ic=b.components.find(x=>x.id===r.ifComp); if(tg&&ic&&tg.options&&r.removeChoices.length>=tg.options.length) out.push(["warn",t("v_restrict",{c:tg.name,x:ic.name,v:r.ifValue})]); }
  if(!out.length) out.push(["ok",t("v_ok")]);
  return out;
}
function spec(b){
  return {engine:{name:b.name, category:b.pjmCategory, description:b.description, productType:b.productType, language:b.language||LANG, quantityComponent:b.quantityComponent, allowMultipleQuantities:b.multiQty, priceMin:b.priceMin, priceMax:b.priceMax},
    components:b.components.map(cp=>{
      const hw=(cp.hideWhen||[]).map(h=>({component:(b.components.find(x=>x.id===h.component)||{}).name, value:h.value}));
      const base={type:cp.type, name:cp.name, userText:cp.userText, hideWhen:hw};
      if(cp.type==="quantity") return {...base, code:cp.code, unit:cp.unit, min:cp.min, max:cp.max, default:cp.def};
      if(cp.type==="option") return {...base, forceSelect:cp.forceSelect, hidePublic:cp.hidePublic, options:cp.options.map(x=>({name:x.name, adjustPercent:x.adjust, production:x.steps.map(s=>({resource:s.resource, process:s.process, basis:s.basis, formula:s.formula||undefined, note:s.note||undefined}))}))};
      if(cp.type==="material") return {...base, hidePublic:cp.hidePublic, mode:cp.mode, category:cp.category, materials:cp.materials, sheetFormats:cp.sheetFormats, bleedMm:cp.bleed, sides:cp.sides, imposition:cp.imposition};
      return {...base, production:cp.steps.map(s=>({resource:s.resource, process:s.process, basis:s.basis, formula:s.formula||undefined, note:s.note||undefined}))};
    }),
    leadTimes:b.delays.enabled?{component:"option", name:b.delays.name, userText:b.delays.userText, choices:b.delays.choices.map(x=>({name:x.label, adjustPercent:x.markup})), notes:b.delays.notes}:null,
    restrictions:b.restrictions.filter(r=>r.removeChoices.length).map(r=>({if:{component:(b.components.find(x=>x.id===r.ifComp)||{}).name, value:r.ifValue}, component:(b.components.find(x=>x.id===r.thenComp)||{}).name, removeChoices:r.removeChoices})),
    guidedAnswers:questionsFor(b).filter(qq=>answered(b.guided[qq.id])).map(qq=>({id:qq.id, question:qText(qq,"text"), answer:b.guided[qq.id], effect:qText(qq,"effect")})),
    freeRules:b.freeRules.map(r=>({text:r.text, understood:r.understood||"", effects:r.effects||[], unclear:r.unclear||"", validated:r.status==="ok"})),
    businessRules:b.rulesNotes, autoRule:"forced option on --Select-- behaves as its first choice",
    tests:b.tests.map(tc=>({label:tc.label, quantities:tc.q||{}, choices:Object.fromEntries(Object.entries(tc.c||{}).filter(([k,v])=>v).map(([k,v])=>[k==="__delay"?b.delays.name:((b.components.find(x=>x.id===k)||{}).name||k),v])), expected:tc.expected===""?null:tc.expected, last:tc.last||null})),
    pjm:{instance:PJM_URL||null, engineId:(b.pjm||{}).engineId||null, map:(b.pjm||{}).map||null},
    pricing:b.margin, buildNotes:b.notes, status:b.status};
}

    '<div class="card"><div class="hd"><h3 style="font-size:16px">'+t("described")+'</h3></div><div class="bd"><div class="summary">'+sum+extra+'</div></div></div>'+
    testsHtml(b)+
    '<div class="card"><div class="hd"><h3 style="font-size:16px">'+t("specTitle")+'</h3><button class="btn sm" type="button" data-act="copy" style="margin-left:auto">'+t("copyJson")+'</button></div><div class="bd"><pre class="json" id="json">'+esc(json)+'</pre></div></div>';
}

/* ---------- événements ---------- */
function rerenderKeep(){ const y=window.scrollY; renderView(); window.scrollTo(0,y); }
document.addEventListener("input",e=>{
  const el=e.target;
  if(S.draft&&el.dataset&&el.dataset.g!==undefined&&!el.dataset.gmat&&el.type!=="radio"){ const id=el.dataset.g; if(el.dataset.gpart){ const cur=Object.assign({},S.draft.guided[id]||{}); cur[el.dataset.gpart]=el.value===""?"":Number(el.value); S.draft.guided[id]=cur; } else S.draft.guided[id]=el.dataset.gnum?(el.value===""?"":Number(el.value)):el.value; touch(); return; }
  if(S.draft&&el.dataset&&el.dataset.fr!==undefined){ const r=S.draft.freeRules[+el.dataset.fr]; if(r){ r.text=el.value; r.understood=""; r.effects=[]; r.unclear=""; touch(); } return; }
  const path=el.dataset&&el.dataset.bind; if(!path||!S.draft) return;
  if(el.type==="checkbox") return;
  let v=el.value; if(el.dataset.num) v = v===""?"":Number(v);
  setP(S.draft,path,v); touch();
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(S.draft&&el.dataset&&el.dataset.g!==undefined&&(el.type==="radio"||el.dataset.gmat)){ const id=el.dataset.g;
    if(el.type==="radio") S.draft.guided[id]=el.value; else { const st=new Set(S.draft.guided[id]||[]); el.checked?st.add(el.value):st.delete(el.value); S.draft.guided[id]=[...st]; }
    touch(); const card=el.closest(".gq"); if(card) card.classList.toggle("done",answered(S.draft.guided[id])); return; }
  if(S.draft&&el.dataset&&(el.dataset.rhide||el.dataset.rres||el.dataset.rch)){
    const b=S.draft; const [ci,v,ti]=(el.dataset.rhide||el.dataset.rres||el.dataset.rch).split("|"); const tg=b.components.find(x=>x.id===ti); if(!tg) return;
    if(el.dataset.rhide){ tg.hideWhen=(tg.hideWhen||[]).filter(h=>!(h.component===ci&&h.value===v)); if(el.checked){ tg.hideWhen.push({component:ci,value:v}); b.restrictions=b.restrictions.filter(r=>!(r.ifComp===ci&&r.ifValue===v&&r.thenComp===ti)); } }
    else if(el.dataset.rres){ b.restrictions=b.restrictions.filter(r=>!(r.ifComp===ci&&r.ifValue===v&&r.thenComp===ti)); if(el.checked) b.restrictions.push({id:uid(),ifComp:ci,ifValue:v,thenComp:ti,removeChoices:[]}); }
    else { const r=b.restrictions.find(r=>r.ifComp===ci&&r.ifValue===v&&r.thenComp===ti); if(r){ const st=new Set(r.removeChoices); el.checked?st.add(el.value):st.delete(el.value); r.removeChoices=[...st]; } touch(); return; }
    touch(); rerenderKeep(); return;
  }
  if(el.dataset&&el.dataset.mat!==undefined&&S.draft){
    const cp=S.draft.components[+el.dataset.mat]; const set=new Set(cp.materials);
    el.checked?set.add(el.value):set.delete(el.value); cp.materials=[...set]; touch(); return;
  }
  const path=el.dataset&&el.dataset.bind; if(!path||!S.draft) return;
  if(el.type==="checkbox"){ setP(S.draft,path,el.checked); touch(); if(path==="delays.enabled") rerenderKeep(); return; }
  if(el.tagName==="SELECT"){
    setP(S.draft,path,el.value);
    if(/\.resource$/.test(path)) setP(S.draft,path.replace(/resource$/,"process"),"");
    if(/\.hideWhen\.\d+\.component$/.test(path)){ const src=S.draft.components.find(x=>x.id===el.value); setP(S.draft,path.replace(/component$/,"value"),src&&src.options[0]?src.options[0].name:""); }
    touch();
    if(el.dataset.rerender||/\.(mode|category)$/.test(path)||path==="status"||path==="productType"||path==="language") rerenderKeep();
  }
});
document.addEventListener("click",e=>{
  const lb=e.target.closest("[data-lang]");
  if(lb){ LANG=lb.dataset.lang; try{ localStorage.setItem("pjm.lang",LANG);}catch(err){} renderChrome(); renderList(); rerenderKeep(); return; }
  const tg=e.target.closest("[data-open],[data-act],[data-tab],[data-ptype]"); if(!tg) return;
  if(tg.dataset.open){ S.view="brief"; renderChrome(); select(tg.dataset.open); return; }
  if(tg.dataset.tab){ if(S.dirty) flush(); S.tab=tg.dataset.tab; renderView(); return; }
  if(tg.dataset.ptype){ S.creating=tg.dataset.ptype; const n=$("#new-name")&&$("#new-name").value; renderView(); if(n) $("#new-name").value=n; return; }
  const a=tg.dataset.act, b=S.draft, ci=tg.dataset.ci!==undefined?+tg.dataset.ci:null;
  if(a&&a.startsWith("adm-")||a&&a.startsWith("sug-")){ adminAct(a,tg); return; }
  switch(a){
    case "new": startNew(); break;
    case "cancel-new": S.creating=null; renderView(); break;
    case "create": if(S.creating) createBrief(S.creating, ($("#new-name").value||"").trim()); break;
    case "create-import": { const u=($("#imp-url").value||"").trim(); const m2=u.match(/ProductEngines\/Edit\/([0-9a-f-]{36})/i); if(!m2){ toast(t("imp_bad")); break; } createImport(m2[1],u); break; }
    case "del": S.confirmDel=S.sel; renderView(); break;
    case "del-no": S.confirmDel=null; renderView(); break;
    case "del-yes": deleteBrief(S.sel); break;
    case "toggle": { const id=tg.dataset.id; S.matOpen.has(id)?S.matOpen.delete(id):S.matOpen.add(id); rerenderKeep(); break; }
    case "up": case "down": { const j=a==="up"?ci-1:ci+1; if(j<0||j>=b.components.length) break; const arr=b.components; [arr[ci],arr[j]]=[arr[j],arr[ci]]; touch(); rerenderKeep(); break; }
    case "comp-del": S.confirmDel=tg.dataset.id; rerenderKeep(); break;
    case "comp-del-no": S.confirmDel=null; rerenderKeep(); break;
    case "comp-del-yes": { const id=b.components[ci].id; b.components.splice(ci,1); b.components.forEach(x=>x.hideWhen=(x.hideWhen||[]).filter(h=>h.component!==id)); b.restrictions=(b.restrictions||[]).filter(r=>r.ifComp!==id&&r.thenComp!==id); S.confirmDel=null; touch(); rerenderKeep(); break; }
    case "comp-add": { const ty=tg.dataset.t; const used=b.components.filter(x=>x.type==="quantity").map(x=>+x.code.slice(1)).filter(n=>!isNaN(n));
      const nc= ty==="quantity"? q("Q"+((used.length?Math.max(...used):0)+1),t("newQty"),t("newQty"),"",1,9999,1)
        : ty==="option"? o(t("newOpt"),t("newOpt"),[opt(t("choiceN",{n:1}))])
        : ty==="material"? m(t("newMat"),t("paper"))
        : c(t("newCalc"),t("newCalc"),[step()]);
      b.components.push(nc); S.matOpen.add(nc.id); touch(); rerenderKeep(); setTimeout(()=>{const el=document.getElementById("cp-"+nc.id); el&&el.scrollIntoView({block:"center"});},0); break; }
    case "opt-add": b.components[ci].options.push(opt(t("choiceN",{n:b.components[ci].options.length+1}))); touch(); rerenderKeep(); break;
    case "opt-del": b.components[ci].options.splice(+tg.dataset.i,1); touch(); rerenderKeep(); break;
    case "opt-up": { const i=+tg.dataset.i; if(i>0){ const ar=b.components[ci].options; [ar[i-1],ar[i]]=[ar[i],ar[i-1]]; touch(); rerenderKeep(); } break; }
    case "step-add": getP(b,tg.dataset.path).push(step("","","feuilles")); touch(); rerenderKeep(); break;
    case "step-del": getP(b,tg.dataset.path).splice(+tg.dataset.i,1); touch(); rerenderKeep(); break;
    case "hw-add": { const src=b.components.find(x=>x.type==="option"&&x.id!==b.components[ci].id); if(src){ b.components[ci].hideWhen.push({component:src.id,value:src.options[0]?src.options[0].name:""}); touch(); rerenderKeep(); } break; }
    case "hw-del": b.components[ci].hideWhen.splice(+tg.dataset.i,1); touch(); rerenderKeep(); break;
    case "fmt-add": { const wv=+$("#fw-"+ci).value, hv=+$("#fh-"+ci).value; if(wv>0&&hv>0){ b.components[ci].sheetFormats.push({w:wv,h:hv}); touch(); rerenderKeep(); } else toast(t("fmtNeed")); break; }
    case "fmt-del": b.components[ci].sheetFormats.splice(+tg.dataset.i,1); touch(); rerenderKeep(); break;
    case "mat-add": { const inp=$("#matfree-"+ci); const v=(inp.value||"").trim(); if(v&&!b.components[ci].materials.includes(v)){ b.components[ci].materials.push(v); touch(); rerenderKeep(); } break; }
    case "mat-del": { const cp=b.components[ci]; cp.materials=cp.materials.filter(n=>n!==tg.dataset.v); touch(); rerenderKeep(); break; }
    case "fr-add": { const ta=$("#fr-new"); const txt=(ta.value||"").trim(); if(txt){ b.freeRules.push({id:uid(),text:txt,understood:"",effects:[],unclear:"",status:"draft",lang:LANG}); touch(); rerenderKeep(); const i=b.freeRules.length-1; if(S.sample) rephrase(i); } break; }
    case "fr-del": b.freeRules.splice(+tg.dataset.i,1); touch(); rerenderKeep(); break;
    case "fr-sample": rephrase(+tg.dataset.i); break;
    case "fr-ok": b.freeRules[+tg.dataset.i].status="ok"; touch(); rerenderKeep(); break;
    case "fr-fix": b.freeRules[+tg.dataset.i].status="draft"; touch(); rerenderKeep(); break;
    case "fr-suggest": { const r=b.freeRules[+tg.dataset.i]; if(!S.local){ S.db.collection("suggestions").add({text:r.text, understood:r.understood||"", lang:r.lang||LANG, productType:b.productType, briefId:S.sel, briefName:b.name, by:S.uidSelf||null, createdAt:new Date().toISOString()}).then(()=>{ r.suggested=true; touch(); rerenderKeep(); toast(t("fr_sugDone")); },err=>toast(t("fr_err",{e:err&&err.code||"error"}))); } break; }
    case "translate": translateBrief(); break;
    case "req-update": b.status="maj"; touch(); flush(); rerenderKeep(); toast(t("pj_requested",{n:b.name})); break;
    case "req-import": b.status="import"; touch(); flush(); rerenderKeep(); toast(t("pj_requested",{n:b.name})); break;
    case "t-add": b.tests.push({id:uid(),label:t("t_defName",{n:b.tests.length+1}),q:Object.fromEntries(b.components.filter(x=>x.type==="quantity").map(x=>[x.code,x.def])),c:{},expected:"",last:null}); touch(); rerenderKeep(); break;
    case "t-del": b.tests.splice(+tg.dataset.i,1); touch(); rerenderKeep(); break;
    case "dl-add": b.delays.choices.push({id:uid(),label:t("dayPrefix"),markup:0}); touch(); rerenderKeep(); break;
    case "dl-del": b.delays.choices.splice(+tg.dataset.i,1); touch(); rerenderKeep(); break;
    case "dl-up": { const i=+tg.dataset.i; if(i>0){ const ar=b.delays.choices; [ar[i-1],ar[i]]=[ar[i],ar[i-1]]; touch(); rerenderKeep(); } break; }
    case "ready": b.status="pret"; touch(); flush(); rerenderKeep(); toast(t("markedReady")); break;
    case "copy": { const txt=$("#json").textContent; navigator.clipboard.writeText(txt).then(()=>toast(t("jsonCopied")),()=>{ const r=document.createRange(); r.selectNodeContents($("#json")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast(t("selCopy")); }); break; }
  }
});
function openAdmin(){ if(S.dirty) flush(); S.view="admin"; S.creating=null; renderChrome(); renderView(); window.scrollTo(0,0); }
async function adminAct(a,tg){
  if(a==="adm-pjm"){ let v=($("#adm-pjm").value||"").trim().replace(/\/+$/,""); if(v&&!/^https?:\/\//.test(v)) v="https://"+v; try{ await S.db.doc("settings/app").set({defaultLang:ADMIN_LANG, pjmUrl:v, updatedAt:new Date().toISOString()}); toast(t("adm_saved")); }catch(e){ toast(t("adm_fail")); } return; }
  if(a==="adm-lang"){ const v=$("#adm-lang").value||null; try{ await S.db.doc("settings/app").set({defaultLang:v, pjmUrl:PJM_URL||"", updatedAt:new Date().toISOString()}); toast(t("adm_langSaved")); }catch(e){ toast(t("adm_fail")); } return; }
  if(a==="adm-back"){ S.view="brief"; renderChrome(); renderView(); return; }
  if(a==="adm-new"){ const id="q"+Date.now().toString(36); const qq={id, active:true, productTypes:["*"], answerType:"yesno", text:{fr:"",es:"",en:""}, effect:{fr:"",es:"",en:""}, unit:"", showIf:"", order:(Math.max(0,...S.questions.map(x=>x.order||0))+10), createdAt:new Date().toISOString(), source:"admin"};
    try{ await S.db.doc("questions/"+id).set(qq); toast(t("adm_saved")); }catch(e){ toast(t("adm_fail")); } return; }
  if(a==="adm-save"){ const base=S.questions.find(x=>x.id===tg.dataset.id); const card=tg.closest("[data-qcard]"); if(!base||!card) return; const qq=readQCard(card,base);
    try{ await S.db.doc("questions/"+qq.id).set(qq); toast(t("adm_saved")); }catch(e){ toast(t("adm_fail")); } return; }
  if(a==="sug-accept"){ const sg=S.suggestions.find(x=>x.id===tg.dataset.id); if(!sg) return; const id="q"+Date.now().toString(36); const tx={fr:"",es:"",en:""}; tx[sg.lang||"fr"]=sg.text;
    const qq={id, active:false, productTypes:[sg.productType||"*"], answerType:"yesno", text:tx, effect:{fr:"",es:"",en:""}, unit:"", showIf:"", order:(Math.max(0,...S.questions.map(x=>x.order||0))+10), createdAt:new Date().toISOString(), source:"suggestion"};
    try{ await S.db.doc("questions/"+id).set(qq); await S.db.doc("suggestions/"+sg.id).delete(); toast(t("adm_saved")); }catch(e){ toast(t("adm_fail")); } return; }
  if(a==="sug-reject"){ try{ await S.db.doc("suggestions/"+tg.dataset.id).delete(); }catch(e){ toast(t("adm_fail")); } return; }
}
function startNew(){ if(S.dirty) flush(); S.view="brief"; S.creating=""; S.sel=null; S.draft=null; renderList(); renderView(); }
$("#newBtn").addEventListener("click",startNew);
$("#admBtn").addEventListener("click",openAdmin);
document.addEventListener("toggle",e=>{ if(e.target.classList&&e.target.classList.contains("expert")) S.expertOpen=e.target.open; },true);
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id&&/^(fw|fh)-/.test(e.target.id)){ const ci=e.target.id.split("-")[1]; document.querySelector('[data-act="fmt-add"][data-ci="'+ci+'"]').click(); }
  if(e.key==="Enter"&&e.target.id&&/^matfree-/.test(e.target.id)){ document.querySelector('[data-act="mat-add"][data-ci="'+e.target.id.split("-")[1]+'"]').click(); } });
window.addEventListener("beforeunload",()=>{ if(S.dirty) flush(); });

function updCat(){
  const r=S.catalog.resources.length, cc=S.catalog.categories.length;
  const el=$("#catInfo");
  if(S.local){ el.textContent=t("catLocal"); return; }
  if(!S.catLoaded){ el.textContent=t("catLoading"); return; }
  el.innerHTML = r||cc ? esc(t("catInfo",{r:r,m:S.catalog.matTotal||""}))+(S.catalog.readAt?' · '+esc(t("readOn",{d:new Date(S.catalog.readAt).toLocaleDateString(LOCALE())})):"") : esc(t("catNone"));
}

/* ---------- démarrage ---------- */
renderChrome(); renderList(); renderView();
(async()=>{
  const db = window.claude ? await window.claude.use("db") : null;
  const user = window.claude ? await window.claude.use("user") : null;
  S.user=user; if(user){ try{ S.uidSelf=await user.id(); }catch(e){} try{ S.isAdmin=!!(await user.canEdit()); }catch(e){} }
  S.sample = window.claude ? await window.claude.use("sample") : null;
  if(!db){ S.local=true; S.loaded=true; renderChrome(); renderList(); renderView(); return; }
  S.db=db;
  db.doc("catalog/resources").onSnapshot(s=>{ S.catLoaded=true; if(s.exists){ const d=s.data(); S.catalog.resources=d.resources||[]; S.catalog.readAt=d.readAt; } updCat(); if(S.draft&&S.tab==="formulaire") rerenderKeep(); }, ()=>{});
  db.doc("catalog/materials").onSnapshot(s=>{ S.catLoaded=true; if(s.exists){ const d=s.data(); S.catalog.categories=d.categories||[]; S.catalog.matTotal=d.total; } updCat(); if(S.draft&&S.tab==="formulaire") rerenderKeep(); }, ()=>{});
  db.doc("catalog/categories").onSnapshot(s=>{ if(s.exists){ const d=s.data(); S.catalog.engineCategories=Array.isArray(d.categories)?d.categories:[]; } if(S.draft&&S.tab==="produit") rerenderKeep(); }, ()=>{});
  db.doc("settings/app").onSnapshot(sn=>{ const d=sn.exists?sn.data():{}; ADMIN_LANG=LANGS.includes(d.defaultLang)?d.defaultLang:null; PJM_URL=typeof d.pjmUrl==="string"?d.pjmUrl:""; if(!personalLang()){ const nl=ADMIN_LANG||browserLang(); if(nl!==LANG){ LANG=nl; renderChrome(); renderList(); rerenderKeep(); } } if(S.view==="admin") renderAdmin(); else if(S.draft) rerenderKeep(); }, ()=>{});
  db.collection("questions").onSnapshot(snap=>{ S.questions=snap.docs.map(d=>({...d.data(), id:d.id})); if(S.view==="admin") renderAdmin(); else if(S.draft&&(S.tab==="regles"||S.tab==="recap")) rerenderKeep(); }, ()=>{});
  if(S.isAdmin) db.collection("suggestions").onSnapshot(snap=>{ S.suggestions=snap.docs.map(d=>({...d.data(), id:d.id})); if(S.view==="admin") renderAdmin(); }, ()=>{});
  renderChrome();
  let first=true;
  db.collection("briefs").onSnapshot(snap=>{
    for(const ch of snap.docChanges()){
      if(ch.type==="removed"){ S.briefs.delete(ch.doc.id); if(ch.doc.id===S.sel){ S.sel=null; S.draft=null; renderView(); } continue; }
      const d=ch.doc.data(); S.briefs.set(ch.doc.id,d);
      if(ch.doc.id===S.sel && !S.dirty && !S.saving && S.draft && d.updatedAt!==S.draft.updatedAt){ S.draft=normalize(JSON.parse(JSON.stringify(d))); rerenderKeep(); toast(t("updatedOther")); }
    }
    S.loaded=true;
    if(first){ first=false; let last=null; try{ last=localStorage.getItem("pjm.sel"); }catch(e){} if(last&&S.briefs.has(last)&&!S.sel&&S.creating===null) select(last); else renderView(); }
    renderList();
  }, ()=>{ setSave("error","dbLost"); });
})();
})();
</script>
