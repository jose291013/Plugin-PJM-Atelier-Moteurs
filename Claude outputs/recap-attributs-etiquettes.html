<style>
/* Lignes ajoutées au récapitulatif du configurateur (moteur PJM Étiquettes en bobine) */
.pzattr-row .sp-summary__value{font-variant-numeric:tabular-nums;}
.pzattr-sep{list-style:none;margin:8px 0 4px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.15);font-size:.85em;opacity:.75;}
.pzattr-alert{list-style:none;margin:8px 0 0;padding:8px 10px;border-radius:6px;background:#fdecea;color:#8a1c12;border:1px solid #f5c2bc;font-weight:600;}
.pzattr-fallback{margin:12px 0;padding:10px 12px;border:1px solid #e5e5e5;border-radius:6px;}
.pzattr-fallback ul{margin:0;padding:0;}
.pzattr-fallback .sp-summary__row{display:flex;justify-content:space-between;gap:12px;list-style:none;padding:2px 0;}
</style>
<script>
/* Récapitulatif enrichi : résultats de l'Excel Pressero calculés à partir des attributs PJM
   (quantité totale, diamètre final, contrôle 50…N étiquettes/bobine, laize, mètres, poids, date). */
(function (g, d) {
  'use strict';

  var CONFIG = {
    paths: ['/product/etiquette'],          // produits concernés (chemin en minuscules)
    cutoffHour: 10,                         // heure limite : commande avant cette heure = journée comptée (ex. 12)
    fermetures: [                           // jours de fermeture de l'imprimerie (en plus des week-ends et fériés)
      // '2026-12-24',                      // un jour : 'AAAA-MM-JJ'
      // ['2026-08-03', '2026-08-21'],      // une période (dates incluses) : ['début', 'fin']
    ],
    feriesFrance: true,                     // true : tous les fériés français ; false : seulement 1er janvier et 25 décembre
                                            // → doit correspondre au calendrier Pressero (Préférences → Calendriers d'entreprise)
    shipDaysOffset: 0,                      // calage avec la date calculée par Pressero (SHIP_DAYS), normalement 0
    champJoursAjoutes: /heure limite/i,     // libellé du champ technique S1 du moteur PJM
    mandrinMm: 76,                         // mandrin par défaut (sinon attribut ETQ_MANDRIN_MM du choix)
    maxDiamCm: 25,                          // diamètre maxi machine (Excel : 25 cm)
    minParBobine: 50,
    showWorkshopInfo: true                  // laize de bobine mère + mètres linéaires
  };

  var path = (g.location.pathname || '').toLowerCase().replace(/\/+$/, '');
  if (CONFIG.paths.indexOf(path) === -1) { return; }

  var last = null;        // dernier résultat de calcul PJM
  var rendering = false;

  /* ---------- hook de fin de calcul (chaîné : ne pas casser le configurateur) ---------- */
  function hook() {
    var prev = g.intCalcFinish;
    if (prev && prev.__pzattr) { return; }
    var wrapped = function (e, a) {
      try { if (a && a.Attributes) { last = a; } } catch (err) {}
      var r;
      if (typeof prev === 'function') { try { r = prev.apply(this, arguments); } catch (err2) { console.error(err2); } }
      schedule();
      return r;
    };
    wrapped.__pzattr = true;
    g.intCalcFinish = wrapped;
  }

  /* ---------- lecture des attributs ---------- */
  function attrs(a) {
    var o = {};
    (a.Attributes || []).forEach(function (x) {
      var v = String(x.Value == null ? '' : x.Value).replace(',', '.');
      o[x.Key] = isNaN(parseFloat(v)) ? x.Value : parseFloat(v);
    });
    return o;
  }

  /* ---------- calculs repris de l'Excel ---------- */
  function laizeChoisie(N, Q, L, P) {
    // poses par laize, mises en route, coût papier (0,90 €/m²) + 5 € par mise en route ; égalité → la plus large
    var laizes = [220, 180, 140, 100], best = null;
    laizes.forEach(function (W) {
      var K;
      if (W === 100) { K = (N <= Math.floor(80 / (L + 5))) ? N : Math.floor(100 / (L + 20)); }
      else { K = Math.min(N, Math.floor(W / (L + 20))); }
      if (K <= 0) { return; }
      var MR = Math.ceil(N / K);
      var cout = MR * (Q * P * 0.9 * W / 1e6 + 5);
      if (!best || cout < best.cout) { best = { W: W, MR: MR, cout: cout, ml: MR * Q * P / 1000 }; }
    });
    return best;
  }

  // Enroulement : surface de la couronne = longueur × épaisseur → D = 2 × √(L × e / π + r_mandrin²)
  function diametreMm(Q, P, epMm, mandrinMm) {
    var r2 = Math.pow(mandrinMm / 2, 2);
    var longueurMm = P * Q;
    return Math.floor(Math.sqrt(longueurMm * epMm / Math.PI + r2) * 2);   // arrondi au mm inférieur (comme l'Excel)
  }

  function maxParBobine(P, epMm, diamMaxMm, mandrinMm) {
    var r2 = Math.pow(mandrinMm / 2, 2);
    var rMax2 = Math.pow(Math.min(diamMaxMm, CONFIG.maxDiamCm * 10) / 2, 2);
    return Math.floor((Math.PI * (rMax2 - r2)) / epMm / P);
  }

  /* ---------- date de livraison (jours ouvrés, fériés France) ---------- */
  function paques(y) {
    var a = y % 19, b = Math.floor(y / 100), c = y % 100, dd = Math.floor(b / 4), e = b % 4,
        f = Math.floor((b + 8) / 25), gg = Math.floor((b - f + 1) / 3), h = (19 * a + b - dd - gg + 15) % 30,
        i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
        mois = Math.floor((h + l - 7 * m + 114) / 31), jour = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, mois - 1, jour);
  }
  var feriesCache = {};
  function estFerie(dt) {
    var y = dt.getFullYear();
    if (!feriesCache[y]) {
      var p = paques(y), add = function (n) { var x = new Date(p); x.setDate(x.getDate() + n); return x; };
      feriesCache[y] = (CONFIG.feriesFrance
        ? [new Date(y, 0, 1), add(1), new Date(y, 4, 1), new Date(y, 4, 8), add(39), add(50),
           new Date(y, 6, 14), new Date(y, 7, 15), new Date(y, 10, 1), new Date(y, 10, 11), new Date(y, 11, 25)]
        : [new Date(y, 0, 1), new Date(y, 11, 25)])
        .map(function (x) { return x.toDateString(); });
    }
    return feriesCache[y].indexOf(dt.toDateString()) !== -1;
  }
  function iso(dt) { var m = dt.getMonth() + 1, j = dt.getDate(); return dt.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (j < 10 ? '0' : '') + j; }
  function estFerme(dt) {
    var s = iso(dt);
    return (CONFIG.fermetures || []).some(function (f) {
      return Array.isArray(f) ? (s >= f[0] && s <= f[1]) : s === f;
    });
  }
  function ouvre(dt) { var j = dt.getDay(); return j !== 0 && j !== 6 && !estFerie(dt) && !estFerme(dt); }
  function ajouterJoursOuvres(dt, n) {            // = WORKDAY(dt, n)
    var x = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
    while (n > 0) { x.setDate(x.getDate() + 1); if (ouvre(x)) { n--; } }
    return x;
  }
  function dateLivraison(jours) {
    var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), debut;
    if (!ouvre(today)) { debut = ajouterJoursOuvres(today, 1); }               // commande un jour non ouvré
    else if (now.getHours() >= CONFIG.cutoffHour) { debut = new Date(today); debut.setDate(debut.getDate() + 1); }
    else { debut = today; }
    return ajouterJoursOuvres(debut, jours);
  }
  /* ---------- SHIP_DAYS pour Pressero : jours ajoutés envoyés à PJM dans le champ technique S1 ----------
     Pressero compte SHIP_DAYS en jours ouvrés depuis aujourd'hui avec son calendrier. PJM renvoie SHIP_DAYS = N + S1 ;
     S1 = jours ouvrés entre aujourd'hui et la date estimée, moins N (heure limite, commande un jour non ouvré). */
  function joursOuvresJusqua(date) {
    var now = new Date(), x = new Date(now.getFullYear(), now.getMonth(), now.getDate()), n = 0;
    while (x < date) { x.setDate(x.getDate() + 1); if (ouvre(x)) { n++; } }
    return n;
  }
  function joursChoisis() {
    var sel = [].slice.call(d.querySelectorAll('select.PriceCalc_CalcParmSelect')).filter(function (s) {
      var lab = s.closest('li') && s.closest('li').querySelector('label');
      return lab && /d[ée]lai/i.test(lab.textContent);
    })[0];
    var opt = sel && sel.options[sel.selectedIndex];
    var m = opt && opt.text.match(/(\d+)/);
    return m ? parseInt(m[1], 10) : 0;
  }
  function syncJoursAjoutes() {
    var inp = [].slice.call(d.querySelectorAll('input.PriceCalc_CalcParmInput')).filter(function (i) {
      var li0 = i.closest('li');
      return li0 && CONFIG.champJoursAjoutes.test(li0.textContent);
    })[0];
    if (!inp) { return; }
    var li0 = inp.closest('li');                              // champ technique : jamais visible
    li0.style.display = 'none';
    var sec = li0.closest('.sp-section');
    if (sec && !sec.querySelector('.sp-field:not([style*="display: none"]), .sp-segmented')) { sec.style.display = 'none'; }
    var n = joursChoisis();
    if (!n) { return; }
    var v = String(Math.max(0, joursOuvresJusqua(dateLivraison(n)) - n + CONFIG.shipDaysOffset));
    if (inp.value !== v) {
      inp.value = v;
      var kq = g.kendo && g.kendo.jQuery;
      if (kq) { kq(inp).trigger('change'); } else { inp.dispatchEvent(new Event('change', { bubbles: true })); }
    }
  }

  var JOURS = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  function formatDate(dt) { return JOURS[dt.getDay()] + ' ' + dt.getDate() + ' ' + MOIS[dt.getMonth()] + ' ' + dt.getFullYear(); }

  function nf(x, dec) { return Number(x).toLocaleString('fr-FR', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }

  /* ---------- lignes à afficher ---------- */
  function buildRows(a) {
    var A = attrs(a);
    var N = A.ETQ_NB_BOBINES, Q = A.ETQ_QTE_PAR_BOBINE, L = A.ETQ_LAIZE_ETIQ_MM, P = A.ETQ_PAS_MM;
    if (!(N > 0 && Q > 0 && L > 0 && P > 0)) { return null; }
    var es = A.ETQ_EPAISSEUR_SUPPORT_UM, ef = A.ETQ_EPAISSEUR_FILM_UM || 0;
    var rows = [], alert = null;

    rows.push(['Quantité totale d\'étiquettes', nf(A.ETQ_QTE_TOTALE || N * Q)]);
    if (es > 0) {
      var ep = (es + ef) / 1000;    // µm → mm
      var mandrin = A.ETQ_MANDRIN_MM > 0 ? A.ETQ_MANDRIN_MM : CONFIG.mandrinMm;
      rows.push(['Diamètre final des bobines (mandrin ' + mandrin + ' mm)', nf(diametreMm(Q, P, ep, mandrin)) + ' mm']);
      var max = maxParBobine(P, ep, A.ETQ_DIAM_MAX_MM || 300, mandrin);
      if (Q < CONFIG.minParBobine || Q > max) {
        alert = 'Important ! La quantité d\'étiquettes par bobine doit être entre ' + CONFIG.minParBobine + ' et ' + nf(max) + '.';
      }
    }
    if (CONFIG.showWorkshopInfo) {
      var lz = laizeChoisie(N, Q, L, P);
      if (lz) {
        rows.push(['Laize de la bobine mère', lz.W + ' mm']);
        rows.push(['Longueur à dérouler', nf(lz.ml, (lz.ml < 100 && lz.ml % 1) ? 1 : 0) + ' m']);
      }
    }
    var poids = parseFloat(String(a.Weight == null ? '' : a.Weight).replace(',', '.'));   // PJM renvoie « 1,68646 »
    if (poids > 0) { rows.push(['Poids estimé', nf(poids, 2) + ' kg']); }
    if (A.ETQ_JOURS_OUVRES > 0) { rows.push(['Livraison estimée', formatDate(dateLivraison(A.ETQ_JOURS_OUVRES))]); }
    return { rows: rows, alert: alert };
  }

  /* ---------- rendu dans le récapitulatif ---------- */
  function li(cls) { var x = d.createElement('li'); x.className = cls; return x; }
  function render() {
    if (rendering) { return; }
    rendering = true;
    try {
      try { syncJoursAjoutes(); } catch (eS) { console.error(eS); }
      var old = d.querySelectorAll('.pzattr-item');
      for (var i = 0; i < old.length; i++) { old[i].parentNode.removeChild(old[i]); }
      if (!last) { return; }
      var price = d.getElementById('pricingEngine_lblFinalPrice');
      if (price && /#\.##/.test(price.textContent)) { return; }   // choix incomplets
      var data = buildRows(last);
      if (!data) { return; }

      var body = d.querySelector('#calcParmInputs .sp-summary .sp-section__body');
      if (!body) {                                                // repli sans configurateur
        var box = d.createElement('div'); box.className = 'pzattr-fallback pzattr-item';
        body = d.createElement('ul'); box.appendChild(body);
        var res = d.getElementById('calcResults');
        if (!res || !res.parentNode) { return; }
        res.parentNode.insertBefore(box, res);
      }
      var sep = li('pzattr-sep pzattr-item'); sep.textContent = 'Votre bobine'; body.appendChild(sep);
      data.rows.forEach(function (r) {
        var row = li('sp-summary__row pzattr-row pzattr-item');
        var k = d.createElement('span'); k.className = 'sp-summary__key'; k.textContent = r[0];
        var v = d.createElement('span'); v.className = 'sp-summary__value'; v.textContent = r[1];
        row.appendChild(k); row.appendChild(v); body.appendChild(row);
      });
      if (data.alert) { var al = li('pzattr-alert pzattr-item'); al.textContent = data.alert; body.appendChild(al); }
    } finally { rendering = false; }
  }

  var timer = null;
  function schedule() { clearTimeout(timer); timer = setTimeout(render, 150); }

  /* Le configurateur reconstruit #calcParmInputs à chaque choix : on réinsère nos lignes si elles disparaissent. */
  function observe() {
    var area = d.getElementById('pricingEngineArea') || d.body;
    new MutationObserver(function () {
      if (rendering || !last) { return; }
      if (!d.querySelector('.pzattr-item') || (d.querySelector('#calcParmInputs .sp-summary') && !d.querySelector('#calcParmInputs .sp-summary .pzattr-item'))) { schedule(); }
    }).observe(area, { childList: true, subtree: true });
    var price = d.getElementById('pricingEngine_lblFinalPrice');
    if (price) { new MutationObserver(schedule).observe(price, { childList: true, characterData: true, subtree: true }); }
  }

  function start() {
    hook(); observe(); setTimeout(hook, 1500);
    setTimeout(schedule, 2000);                       // premier calage du champ S1
    setInterval(schedule, 60000);                     // passage de l'heure limite pendant que la page est ouverte
  }   // re-chaîne si le configurateur se définit après nous
  if (d.readyState === 'loading') { d.addEventListener('DOMContentLoaded', start); } else { start(); }
})(window, document);
</script>
